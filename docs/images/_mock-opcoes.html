<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Capturador de Cookie — Opções</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; background: #fff; color: #111; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .row { margin-top: 1rem; display: flex; gap: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #888; border-radius: 4px; background: #f3f3f3; }
    #status { margin-top: 1rem; min-height: 1.5em; color: #0a7a0a; font-weight: 600; }
    .muted { color: #555; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Capturador de Cookie</h1>
  <p class="muted">Captura o header <code>Cookie</code> completo do GET <code>https://www.example.com/app</code> (igual ao Network), inclusive HttpOnly.</p>
  <label for="webhookUrl">URL do webhook</label>
  <input id="webhookUrl" type="url" value="https://webhook.site/your-uuid-here" readonly />
  <label for="intervalHours">Intervalo (horas)</label>
  <input id="intervalHours" type="number" value="12" readonly />
  <p class="muted">Último envio: <span>29/10/2026, 13:19:58</span></p>
  <div class="row">
    <button type="button">Salvar</button>
    <button type="button">Enviar agora</button>
  </div>
  <p id="status">Enviado (HTTP 200)</p>
</body>
</html>
